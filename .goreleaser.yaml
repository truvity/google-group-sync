project_name: google-group-sync

version: 2

builds:
  # K8s/local binary (used standalone or as K8s sidecar).
  - id: google-group-sync
    main: ./cmd/google-group-sync
    binary: google-group-sync
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

  # Lambda function binary (named bootstrap — Lambda runtime requirement).
  - id: google-group-sync-lambda
    main: ./cmd/google-group-sync-lambda
    binary: bootstrap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

  # Lambda extension binary (sidecar for other Lambdas).
  - id: google-group-sync-extension
    main: ./cmd/google-group-sync-extension
    binary: google-group-sync
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  # Raw binary archive (for manual installs / custom deployments).
  - id: binary
    ids:
      - google-group-sync
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # Lambda function ZIP (binary named bootstrap — standalone Lambda with LWA).
  - id: lambda-zip
    ids:
      - google-group-sync-lambda
    formats: [zip]
    name_template: "{{ .ProjectName }}_lambda_{{ .Version }}_{{ .Arch }}"

  # Extension ZIP (Lambda Layer — binary goes to extensions/ so it lands at /opt/extensions/).
  - id: extension-zip
    ids:
      - google-group-sync-extension
    formats: [zip]
    name_template: "{{ .ProjectName }}_extension_{{ .Version }}_{{ .Arch }}"
    wrap_in_directory: extensions

kos:
  - id: google-group-sync
    build: google-group-sync
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    bare: true
    preserve_import_paths: false
    base_import_paths: true
    base_image: gcr.io/distroless/static:nonroot
    sbom: none
    labels:
      org.opencontainers.image.title: google-group-sync
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/truvity/google-group-sync

release:
  github:
    owner: truvity
    name: google-group-sync
  header: |
    ## Google Group Sync {{ .Tag }}

    Docker image: `ghcr.io/truvity/google-group-sync:{{ .Version }}`
    Helm chart: `oci://ghcr.io/truvity/charts/google-group-sync:{{ .Version }}`

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Bug Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
