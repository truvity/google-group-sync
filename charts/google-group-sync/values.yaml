replicaCount: 2

image:
  repository: ghcr.io/truvity/google-group-sync
  tag: ""  # defaults to chart appVersion
  pullPolicy: IfNotPresent

env:
  GOOGLE_ADMIN_EMAIL: ""
  # GOOGLE_SA_KEY_FILE: /etc/secrets/sa-key.json
  PORT: "8080"
  HEALTH_PORT: "7070"
  # DirectoryService (ConnectRPC). Set DOMAINS (comma-separated, the
  # addresses this directory vouches for) and optionally PROBE_GROUP per
  # deployment. CONNECT_PORT: "0" disables the DirectoryService.
  CONNECT_PORT: "8090"
  CACHE_TTL: "5m"
  CACHE_MAX_SIZE: "10000"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

# Mount a Secret as a file for the SA key.
secrets:
  # Name of existing Secret containing the SA key JSON.
  saKeySecretName: ""
  # Key within the Secret.
  saKeySecretKey: "sa-key.json"

service:
  connectPort: 8090
  type: ClusterIP
  port: 8080

resources:
  limits:
    memory: 64Mi
  requests:
    cpu: 10m
    memory: 32Mi

serviceAccount:
  create: true
  name: ""

# PodDisruptionBudget — enabled automatically when replicaCount >= 2.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Optional CiliumNetworkPolicy — default off.
# When enabled, restricts ingress to only pods matching the specified labels.
ciliumNetworkPolicy:
  enabled: false
  # Ingress allowed from pods with these labels (e.g., rbac-mapper Deployment + CronJob).
  ingressFrom: []
  # - matchLabels:
  #     app.kubernetes.io/name: zitadel-rbac-mapper

# Optional RBAC (ServiceAccount + Role/RoleBinding) — default off.
# Enable if the pod needs API server access (e.g., reading ConfigMaps).
rbac:
  enabled: false
  rules: []
  # - apiGroups: [""]
  #   resources: ["configmaps"]
  #   verbs: ["get", "list", "watch"]

# Optional HTTPRoute (Envoy Gateway) — default off.
# group-sync is internal-only; enable only if external access is needed.
httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []
  rules: []

nodeSelector: {}
tolerations: []
affinity: {}

# Container hardening. The image is distroless static:nonroot; the chart
# pins that contract at the pod level.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
